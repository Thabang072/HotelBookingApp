<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | StayEase</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <h1>
        Create Account
    </h1>

    <p>
        Register to start booking hotels.
    </p>


    <form id="registerForm">

        <label for="registerName">
            Full Name
        </label>

        <input
            type="text"
            id="registerName"
            required
        >


        <label for="registerEmail">
            Email
        </label>

        <input
            type="email"
            id="registerEmail"
            required
        >


        <label for="registerPassword">
            Password
        </label>

        <input
            type="password"
            id="registerPassword"
            minlength="6"
            required
        >


        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            minlength="6"
            required
        >


        <button
            type="submit"
            class="primary-button"
        >
            Create Account
        </button>


        <p
            id="registerMessage"
            class="form-message"
        ></p>

    </form>


    <p class="auth-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>

</div>


<script src="js/auth.js"></script>

</body>

</html>
