<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | StayEase</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <h1>
        Welcome Back
    </h1>

    <p>
        Login to manage your bookings.
    </p>


    <form id="loginForm">

        <label for="loginEmail">
            Email
        </label>

        <input
            type="email"
            id="loginEmail"
            required
        >


        <label for="loginPassword">
            Password
        </label>

        <input
            type="password"
            id="loginPassword"
            required
        >


        <label class="checkbox-label">

            <input
                type="checkbox"
                id="rememberMe"
            >

            Remember me

        </label>


        <button
            type="submit"
            class="primary-button"
        >
            Login
        </button>


        <p
            id="loginMessage"
            class="form-message"
        ></p>

    </form>


    <p class="auth-link">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </p>

</div>


<script src="js/auth.js"></script>

</body>

</html>
